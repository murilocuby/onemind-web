/* ============ FORM ============ */
.fsec{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);margin:18px 0 8px;grid-column:1/-1;display:flex;align-items:center;gap:8px}
.fsec::after{content:'';flex:1;height:1px;background:var(--line2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px;letter-spacing:.2px}
.help{width:13px;height:13px;border-radius:50%;border:1px solid var(--faint);color:var(--faint);font-size:8.5px;display:inline-flex;align-items:center;justify-content:center;cursor:help;flex:none}
.help:hover{border-color:var(--ink);color:var(--ink)}
[data-tip].help:hover::after{white-space:normal;width:210px;text-align:left;line-height:1.5}
.suf{position:relative;display:flex;align-items:center}
.suf input,.suf select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;font-family:inherit;background:#fbfbfc;width:100%;transition:border .15s,background .15s;font-variant-numeric:tabular-nums}
.suf input:hover{background:#fff}
.suf input:focus,.suf select:focus{outline:none;border-color:#1d1d1f;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.suf input::placeholder{color:#c0c0c4;font-weight:400}
.suf .u{position:absolute;right:11px;font-size:10.5px;color:var(--faint);pointer-events:none;background:transparent}
.suf input.hasu{padding-right:52px}
.typrow{display:flex;gap:7px;flex-wrap:wrap}
.typrow button{border:1px solid var(--line);background:#fff;border-radius:980px;padding:7px 13px;font-size:12px;cursor:pointer;color:var(--muted);font-family:inherit;transition:all .16s}
.typrow button:hover{border-color:rgba(0,0,0,.3);color:var(--ink)}
.typrow button.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:500}
/* ============ TABS ============ */
.rtabs{display:flex;gap:2px;background:rgba(0,0,0,.05);border-radius:12px;padding:3px;margin-bottom:18px;width:max-content;max-width:100%;flex-wrap:wrap}
.rtabs button{border:0;background:transparent;padding:7px 14px;font-size:12.5px;color:var(--muted);cursor:pointer;border-radius:9px;font-family:inherit;transition:all .18s;font-weight:500}
.rtabs button:hover{color:var(--ink)}
.rtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:600}
/* ============ TABLE ============ */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:10px 10px;border-bottom:1px solid var(--line);font-weight:600}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line2)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.grp td{background:#f7f7f8;font-weight:600;font-size:11.5px}
table.t tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0;font-size:13px}
table.t tr.sub td{font-weight:600;background:#fbfbfc}
table.t tr:hover td{background:#fafafa}
table.t tr.grp:hover td{background:#f2f2f4}
input.cell{border:1px solid transparent;background:transparent;border-radius:7px;padding:4px 7px;font-size:12.5px;font-family:inherit;text-align:right;width:92px;font-variant-numeric:tabular-nums;transition:all .15s}
input.cell.wide{width:100%;text-align:left}
input.cell:hover{border-color:var(--line);background:#fff}
input.cell:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.06)}
input.cell.mini{width:34px;padding:3px 2px;font-size:10.5px;text-align:center}
.win{display:inline-flex;align-items:center;gap:2px;color:var(--faint);font-size:9.5px;flex:none}
/* ============ HOME ============ */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:26px}
.opt{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:26px;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:all .2s;display:flex;flex-direction:column}
.opt:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.09)}
.opt .ot{font-size:17px;font-weight:680;letter-spacing:-.3px}
.opt .os{font-size:11.5px;color:var(--muted);margin:3px 0 14px}
.opt ul{list-style:none;margin:0 0 18px;flex:1}
.opt li{font-size:12.5px;color:#3a3a3c;padding:5px 0 5px 22px;position:relative;border-bottom:1px solid var(--line2)}
.opt li:last-child{border-bottom:0}
.opt li::before{content:'✓';position:absolute;left:2px;color:var(--ok);font-weight:700;font-size:11px}
.opt .btn{align-self:flex-start}
/* ============ GANTT ============ */
.gwrap{overflow-x:auto;border:1px solid var(--line2);border-radius:12px;background:#fff}
.gantt{display:grid;font-size:11px;min-width:100%}
.gantt .gh{padding:8px 6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--line);text-align:center;background:#fafafa;white-space:nowrap}
.gantt .gname{padding:7px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;position:sticky;left:0;z-index:2;border-right:1px solid var(--line2)}
.gantt .gname b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:10.5px}
.gantt .gc{border-bottom:1px solid var(--line2);border-left:1px solid var(--line2);position:relative;min-height:26px}
.gantt .gbar{position:absolute;top:6px;bottom:6px;left:2px;right:2px;border-radius:5px;background:#1d1d1f}
.gantt .gbar.lic{background:linear-gradient(90deg,#3a3a3c,#1d1d1f)}
.gantt .gbar.mark{background:linear-gradient(90deg,var(--brain1),var(--brain2))}
.gantt .gval{padding:7px 6px;text-align:center;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line2);border-left:1px solid var(--line2);font-size:10px;color:var(--muted);white-space:nowrap}
.gantt .grow-t{background:#fafafa;font-weight:600;color:var(--ink)}
/* ============ CHART ============ */
.chart{position:relative;padding:6px 0 2px}
.chart svg{display:block;width:100%}
/* ============ BOARD ============ */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.col{background:rgba(0,0,0,.03);border-radius:16px;padding:12px}
.colhead{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 8px 10px;text-transform:uppercase;letter-spacing:.6px}
.deal{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .18s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.deal:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.deal h3{font-size:14px;font-weight:640;letter-spacing:-.2px}
.deal .tipo{font-size:11px;color:var(--muted);margin:3px 0 0}
.deal .mrow{display:flex;gap:20px;margin-top:12px}
.deal .mv{font-size:14.5px;font-weight:650;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.deal .ml{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.chip{font-size:10px;padding:3px 9px;border-radius:980px;background:rgba(0,0,0,.05);color:var(--muted);white-space:nowrap}
.empty{color:var(--faint);font-size:12px;padding:18px;text-align:center}
.needdata{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px}
.needdata b{display:block;font-size:15px;color:var(--ink);margin-bottom:6px}
/* ============ IA ============ */
.ia{background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:22px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ia .iahead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ia .brainbig{width:26px;height:26px}
.ia h4{font-size:14px;font-weight:650}
.ia h4 span{display:block;font-size:10.5px;color:var(--faint);font-weight:400;margin-top:1px}
.ia .verdict{margin-left:auto}
.iagrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.iabox{border:1px solid var(--line2);border-radius:12px;padding:14px 16px}
.iabox h5{font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:9px}
.iabox.pos h5{color:var(--ok)}.iabox.neg h5{color:var(--bad)}
.iabox p{font-size:12.5px;margin-bottom:8px;color:#3a3a3c;padding-left:14px;position:relative}
.iabox p::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%}
.iabox.pos p::before{background:var(--ok)}.iabox.neg p::before{background:var(--bad)}
.badge{display:inline-block;font-size:10.5px;padding:4px 11px;border-radius:980px;font-weight:600}
.badge.g{background:#e7f4ea;color:var(--ok)}.badge.y{background:#faf2dd;color:var(--warn)}.badge.r{background:#fbe9e4;color:var(--bad)}
.note{font-size:11px;color:var(--faint);margin-top:10px}
/* ============ DOC (Memorial) ============ */
.docwrap{display:flex;justify-content:center}
.sheet{width:100%;max-width:800px;background:#fff;border:1px solid var(--line2);border-radius:4px;padding:52px 58px;box-shadow:0 2px 16px rgba(0,0,0,.06);font-size:12.5px;color:#1d1d1f}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid #111;padding-bottom:16px;margin-bottom:26px}
.dhead .meta{text-align:right;font-size:13px;font-weight:650;line-height:1.5;letter-spacing:-.2px}
.dhead .meta small{display:block;font-weight:400;color:#777;font-size:10.5px;margin-top:2px}
h2.dsec{display:flex;align-items:baseline;gap:10px;font-size:13px;text-transform:uppercase;letter-spacing:1px;margin:24px 0 10px}
h2.dsec .sn{color:#999;font-size:11px;font-variant-numeric:tabular-nums}
.sheet p{margin-bottom:9px;line-height:1.6;text-align:justify}
.sheet ul{margin:4px 0 10px 18px}.sheet li{margin-bottom:4px;line-height:1.55}
table.spec{width:100%;border-collapse:collapse;font-size:11.5px;margin:8px 0}
table.spec th{background:#111;color:#fff;text-align:left;padding:7px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.6px}
table.spec td{padding:6px 10px;border-bottom:1px solid #e8e8e8;vertical-align:top}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kc{border:1px solid #e5e5e5;border-radius:10px;padding:10px 12px;text-align:center}
.kc .kv{font-size:16px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kc .kl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#888;margin-top:2px}
.dfoot{display:flex;justify-content:space-between;border-top:1px solid #ddd;margin-top:30px;padding-top:12px;font-size:9.5px;color:#999;text-transform:uppercase;letter-spacing:.6px}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(8px);background:#1d1d1f;color:#fff;padding:9px 18px;border-radius:980px;font-size:12.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@page{size:A4 landscape;margin:0}
@media print{@page{size:A4;margin:12mm}html,body{height:auto!important}body>*:not(#printMount){display:none!important}#printMount,#printMount *{visibility:visible}#printMount{display:block!important;position:absolute;top:0;left:0;width:100%}.sheet{border:0;box-shadow:none;max-width:100%;border-radius:0}.zbtn{display:none!important}.chart svg{animation:none!important;clip-path:none!important}
#printMount thead{display:table-header-group}
#printMount tr{page-break-inside:avoid;break-inside:avoid}
#printMount .card,#printMount .stat,#printMount .insights,#printMount .chart,#printMount .grid>*{page-break-inside:avoid;break-inside:avoid}
#printMount .tblwrap{max-height:none!important;overflow:visible!important}
#printMount .ps-head,#printMount .pcover,#printMount .pagenda,#printMount .pclose,#printMount .psec-body>.card:first-child{break-inside:avoid}}


/* ============ MOBILE VISUAL iOS — OneBuilding v17 ============ */

/* --- Springboard (grade de ícones) — some no desktop, aparece no mobile --- */
.springboard{ display:none; }
.ios-tabbar{ display:none; }
.medge{ display:none; }

/* --- DESKTOP: menu que abre ao passar o mouse (hover-to-open) --- */
@media (hover:hover) and (min-width:761px){
  .side{ width:64px; transition:width .2s ease; }
  .side .lbl,.side .sec,.side .foot{ opacity:0; transition:opacity .12s ease; }
  .side .brandfull{ display:none!important; }
  .side:hover .brandfull{ display:block!important; opacity:1; }
  .side:hover{ width:232px; box-shadow:6px 0 24px rgba(0,0,0,.10); }
  .side:hover .lbl,.side:hover .sec,.side:hover .brandfull,.side:hover .foot{ opacity:1; }
  .side .brandmini{ display:inline-flex!important; }
  .side:hover .brandmini{ display:none!important; }
  .side:hover .brandfull{ display:block!important; }
  .collapseBtn{ display:none!important; } /* hover substitui o botão manual */
}

/* --- MOBILE iPhone/iPad retrato: springboard + tab bar --- */
@media (max-width:760px){
  /* esconde a home "hero" desktop e mostra o springboard */
  .hero{ display:none !important; }
  .springboard{ display:grid !important; grid-template-columns:repeat(4,1fr); gap:18px 12px;
                padding:22px 16px calc(96px + var(--safe-b)); }
  .sb-app{ display:flex; flex-direction:column; align-items:center; gap:7px; background:none; border:none;
           cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .sb-ic{ width:60px; height:60px; border-radius:16px; display:flex; align-items:center; justify-content:center;
          font-size:27px; color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.18); transition:transform .12s ease; }
  .sb-app:active .sb-ic{ transform:scale(.90); }
  .sb-tx{ font-size:11.5px; color:var(--ink); text-align:center; line-height:1.15; max-width:74px; }
  .sb-obra .sb-ic{ background:linear-gradient(160deg,#0071e3,#0a5bd0); }
  .sb-lot  .sb-ic{ background:linear-gradient(160deg,#F9A521,#E84C68); }
  .sb-board .sb-ic{ background:linear-gradient(160deg,#34c759,#128a3c); }
  .sb-consol .sb-ic{ background:linear-gradient(160deg,#6A6F78,#3d4148); }
  .sb-sec{ grid-column:1/-1; font-size:12px; font-weight:600; color:var(--faint); margin:8px 2px 0; }
  .sb-draft{ grid-column:1/-1; display:flex; align-items:center; gap:12px; background:var(--card,#fff);
             border:1px solid var(--line2); border-radius:14px; padding:13px 14px; text-align:left; cursor:pointer; }
  .sb-draft .d-em{ width:42px;height:42px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
                   font-size:19px;color:#fff;background:linear-gradient(160deg,#8e8e93,#636366); }
  .sb-draft.is-lot .d-em{ background:linear-gradient(160deg,#F9A521,#E84C68); }
  .sb-draft .d-b{ flex:1; min-width:0; }
  .sb-draft h4{ margin:0;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .sb-draft p{ margin:2px 0 0;font-size:11.5px;color:var(--faint); }
  .sb-draft .d-x{ color:var(--bad,#e0245e);font-size:12px;padding:6px 8px;border:none;background:none; }

  /* tab bar inferior estilo iOS */
  .ios-tabbar{ display:flex !important; position:fixed; left:0; right:0; bottom:0; z-index:57;
     padding:8px 6px calc(6px + var(--safe-b)); background:rgba(252,252,254,.92);
     -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
     border-top:1px solid var(--line2); }
  body.dark .ios-tabbar{ background:rgba(28,28,30,.92); }
  .tb{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none;
       color:var(--faint); font-size:10.5px; cursor:pointer; }
  .tb .tb-i{ font-size:20px; line-height:1; }
  .tb.on{ color:var(--blue,#0071e3); }

  /* aba lateral (drawer) continua existindo para acessar relatórios internos */
  .medge{ display:block; position:fixed; top:0; left:0; width:16px; height:100vh; height:100dvh; z-index:56; }
}

/* ============ RESPONSIVO iPad / iPhone (OneBuilding v16) ============ */
:root{ --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
       --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px); }
html,body{ -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:contain; }
.side{ padding-top:var(--safe-t); padding-bottom:var(--safe-b); }
.main{ padding-left:var(--safe-l); padding-right:var(--safe-r); }
.topbar{ padding-top:calc(10px + var(--safe-t)); }
button,.segbtn,.pill,.it,.card,.chip{ touch-action:manipulation; }
input,select,textarea{ font-size:16px; } /* evita zoom automático de foco no iOS */

/* Botão flutuante p/ abrir menu no mobile (aparece só em telas estreitas) */
#mnav{ display:none; position:fixed; top:calc(10px + var(--safe-t)); left:calc(10px + var(--safe-l));
       z-index:60; width:40px; height:40px; border-radius:12px; border:1px solid var(--line2);
       background:var(--card,#fff); color:var(--ink,#1d1d1f); font-size:20px; line-height:38px;
       text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.12); cursor:pointer; }
#mscrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.32); z-index:55; }

/* --- Tablet retrato / iPad (<=1024px) --- */
@media (max-width:1024px){
  .grid,.g2,.g3,.cards{ grid-template-columns:1fr !important; }
  .topbar h1{ font-size:20px; }
  .card{ padding:16px; }
}

/* --- Telefone / iPhone (<=760px): sidebar vira drawer --- */
@media (max-width:760px){
  .layout{ display:block; }
  .side{ position:fixed; top:0; left:0; height:100vh; height:100dvh; width:82vw; max-width:300px;
         transform:translateX(-102%); transition:transform .26s ease; z-index:58;
         box-shadow:0 0 32px rgba(0,0,0,.22); }
  body.mopen .side{ transform:translateX(0); }
  body.mopen #mscrim{ display:block; }
  #mnav{ display:block; }
  .main{ width:100%; }
  .topbar{ padding-left:12px; } /* espaço p/ o botão flutuante */
  .actions{ flex-wrap:wrap; gap:6px; }
  .segbtn{ padding:9px 12px; }
  /* Tabelas largas rolam DENTRO da propria caixa, sem cortar a pagina */
  .xhint{ font-size:11px; color:var(--faint); padding:1px 2px 5px; display:flex; align-items:center; gap:5px; }
  .xhint::before{ content:"⟷"; font-size:13px; }
  .xscroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; border-radius:10px; }
  .xscroll table.t{ width:auto; min-width:100%; }
  .xscroll table.t td.n,.xscroll table.t th.n{ white-space:nowrap; } /* numeros nunca quebram */
  .tblwrap{ overflow:auto !important; -webkit-overflow-scrolling:touch; }
  /* Graficos SVG cabem na largura do iPhone */
  .content svg{ max-width:100%; height:auto; }
  /* Mais area util: menos padding lateral no telefone */
  .content{ padding:16px 14px calc(88px + var(--safe-b)) !important; }
  .card{ padding:15px 14px; }
  .mrow{ gap:10px; flex-wrap:wrap; }
  .pill,.btn{ min-height:44px; } /* alvo de toque confortável */
  h1{ font-size:19px; }
}


/* ===== v22: planilhas, gantt e marca ===== */
table.t td,table.t th{white-space:nowrap}
table.t tr.hlrow td{background:rgba(0,113,227,.09)!important;box-shadow:inset 3px 0 0 var(--blue,#0071e3)}
table.t td.hlcol,table.t th.hlcol{background:rgba(249,165,33,.14)!important}
.tblwrap{overflow:auto;-webkit-overflow-scrolling:touch}
.gwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gwrap svg{max-width:none!important;min-width:900px;width:100%;height:auto}


/* ===== v24: memorial FLG + nav ===== */
.memdoc{background:#fff;border:1px solid var(--line2);border-radius:16px;padding:34px 38px;max-width:860px;margin:0 auto;font-size:12.5px;line-height:1.7}
.mhead{display:flex;align-items:center;gap:14px;border-bottom:2px solid #1D1D1F;padding-bottom:14px;margin-bottom:14px}
.mt1{font-weight:800;font-size:16px;letter-spacing:.4px}.mt2{font-size:11px;color:var(--muted);letter-spacing:1.4px}
.mfacts{background:var(--mist,#F5F6F9);border-radius:10px;padding:12px 16px;margin-bottom:18px;display:grid;gap:3px;font-size:12px}
.msec{margin-bottom:16px}.msec h5{font-size:12.5px;letter-spacing:.4px;margin:0 0 6px;border-left:3px solid #E84C68;padding-left:8px}
.msec p{margin:0 0 7px}.msec ul{margin:4px 0 8px;padding-left:18px}.msec li{margin-bottom:3px}
.mtab{font-size:11px}.mfoot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line2);font-size:10.5px;color:var(--faint);text-align:center}

/* v25: marca no menu */

const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const HOJE=new Date(2026,6,1);
function addMonths(dt,n){return new Date(dt.getFullYear(),dt.getMonth()+n,1);}
function addDays(dt,n){const x=new Date(dt);x.setDate(x.getDate()+Math.round(n));return x;}
function fmtMY(dt){return MES[dt.getMonth()]+'/'+String(dt.getFullYear()).slice(2);}
function fmtD(dt){return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+String(dt.getFullYear()).slice(2);}
let CUR={code:'BRL',sym:'R$',rate:1};
const RATES={BRL:1,USD:1/5.40,EUR:1/5.90};let RATES_LIVE=false;
function cv(n){return (n||0)*CUR.rate;}
function num(n,d){return (n||0).toLocaleString('pt-BR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function brl(n){return CUR.sym+' '+num(cv(n));}
function brl2(n){return CUR.sym+' '+num(cv(n),2);}
function mi(n){n=cv(n);const suf=CUR.code==='BRL'?{mi:' mi',mil:' mil'}:{mi:'M',mil:'k'};if(Math.abs(n)>=1e6)return CUR.sym+' '+(n/1e6).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+suf.mi;if(Math.abs(n)>=1e3)return CUR.sym+' '+num(n/1e3)+suf.mil;return CUR.sym+' '+num(n);}
function kmm(n){n=cv(n);const a=Math.abs(n);
 if(a>=1e6)return CUR.sym+' '+(n/1e6).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' MM';
 if(a>=1e3)return CUR.sym+' '+(n/1e3).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})+' K';

function pctf(n){return num(n,1).replace(',0','')+'%';}

function fmtIn(v,dec){if(v==null||v==='')return '';return num(v,dec!=null?dec:(Math.abs(v%1)>0.0001?2:0));}

function rBC(d,c){
 if(!c.ready)return needData('Complete os dados para gerar o business case.');
 const L=d.classe==='lot';
 const tese=L
  ?`Loteamento ${d.tipo==='Loteamento fechado'?'fechado':'aberto'} em ${d.cidade||'—'}${d.uf?'/'+d.uf:''}: ${num(V(d.qtdLotes))} lotes de ${num(V(d.tamLote))} m², VGV de ${brl(c.vgv)} e carteira corrigida de ${brl(c.flows[1].recTotal)} no cenário médio. Entrada de ${pctf(V(d.entradaMin))} e ritmo de ${num(V(d.lotesMes))} lotes/mês definem a curva de caixa.`
  :`${d.tipo} de ${num(V(d.abl))} m² em ${d.cidade||'—'}${d.uf?'/'+d.uf:''}: custo de obra de ${brl(c.custoObra)} (${brl(Math.round(c.custoM2))}/m²) e investimento total de ${brl(c.capex)} em ${c.M} meses, com licenciamento no cenário ${LIC_SCEN[d.licScen||'normal'].label}.`;
 const kpis=L
  ?[['VGV',brl(c.vgv)],['Carteira (médio)',brl(c.flows[1].recTotal)],['Resultado',brl(c.resultado)],['Margem',pctf(c.margem)],['Pico de caixa',brl(-c.expMax)],['Preço sugerido',brl(Math.round(c.precoSugM2))+'/m²']]
  :[['Custo da obra',brl(c.custoObra)],['CAPEX total',brl(c.capex)],['Prazo',c.M+' meses'],['Terreno',brl(V(d.terrTotal))],['Pico mensal',brl(c.pico)],['Licenciamento',Math.round(c.lic.total+30)+' dias']];
 const kpiHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0">${kpis.map(k=>`<div class="card" style="padding:13px 15px"><div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)">${k[0]}</div><div style="font-size:20px;font-weight:700;letter-spacing:-.4px">${k[1]}</div></div>`).join('')}</div>`;
 let be=-1;if(L&&c.months){be=c.months.findIndex(m=>m.saldo>=0);}
 const riscos=L
  ?[`Exposição máxima de ${brl(-c.expMax)} — ${(-c.expMax/Math.max(1,c.vgv)*100)>35?'elevada frente ao VGV; mitigar com permuta ou pré-venda':'administrável frente ao VGV'}.`,
    be>=0?`Retorno do capital em ${c.months[be].label}.`:'Caixa não retorna no horizonte — repricing necessário.',
    `Margem ${pctf(c.margem)} vs mínimo ${pctf(V(d.margemMin))}: ${c.margem>=V(d.margemMin)?'aprovável':'abaixo do mínimo — revisar preço/custos'}.`]
  :[`Pico de desembolso mensal de ${brl(c.pico)} — provisionar caixa.`,
    `Licenciamento ${LIC_SCEN[d.licScen||'normal'].label} antecede a obra: atrasos deslocam o cronograma inteiro.`,
    `Terreno representa ${pctf(V(d.terrTotal)/Math.max(1,c.capex)*100)} do CAPEX.`];
 return `<div class="card" style="margin-bottom:14px"><div class="sechead">Tese do investimento</div><div style="font-size:13.5px;line-height:1.65;margin-top:6px">${tese}</div></div>
 ${kpiHTML}
 ${presFicha(d,c)}
 <div class="insights" style="margin-top:14px"><h6>Parecer do Super Agente — riscos e recomendação</h6><ul>${riscos.map(r=>`<li>${r}</li>`).join('')}</ul><div class="note" style="margin-top:6px">Análise gerada por regras sobre os números desta simulação.</div></div>`;
}

function licDur(d,st){const scen=(d&&d.licScen)||'normal';
 const ov=d&&d.licEdit&&d.licEdit[scen];if(ov&&ov[st.id]!=null)return ov[st.id];
 return Math.round(st.dur*LIC_SCEN[scen].f);}
function licSched(d){const map={};LIC.forEach(x=>map[x.id]=x);const es={},ef={},durs={};
 function c(id){if(id in ef)return;const st=map[id];let s0=0;st.pre.forEach(p=>{c(p);s0=Math.max(s0,ef[p]);});durs[id]=licDur(d,st);es[id]=s0;ef[id]=s0+durs[id];}
 LIC.forEach(x=>c(x.id));const total=Math.max(...LIC.map(x=>ef[x.id]));
 return {es,ef,durs,total};}

function drivers(d){const abl=V(d.abl),patio=V(d.patio),M=Math.max(1,Math.round(V(d.nParcelas)||12));
 return {AREA:abl*1.276,GALPAO:abl,COB:abl*1.108,PATIO:patio,MEZ:abl*0.249,DOCAS:Math.max(1,Math.round(abl/730)),MES:M,PISOS:abl+patio*0.94,FIX:1};}
function computeBuild(d){
 const ready=V(d.abl)>0&&V(d.custoObra)>0;
 const target=V(d.abl)*V(d.custoObra)+V(d.patio)*V(d.custoPatio);
 const drv=drivers(d);
 // distribui a base de engenharia FLG proporcionalmente e calibra para fechar no alvo
 let raw=0;const pre=[];
 ORC.forEach(G=>{G.it.forEach(it=>{const q=it.q*(drv[it.drv]/REF[it.drv]);raw+=q*it.p;pre.push({G,it,q});});});
 const k=raw>0?target/raw:0;
 const groups=[];let budget=0;
 ORC.forEach(G=>{const items=[];let sub=0;
  G.it.forEach(it=>{const base=pre.find(x=>x.it===it);let q=base.q,p=it.p*k,dd=it.d;
   const ov=d.orcEdit[it.c];if(ov){if(ov.q!=null)q=ov.q;if(ov.p!=null)p=ov.p;if(ov.d!=null)dd=ov.d;}
   const s=q*p;if(s>=0.5){items.push({c:it.c,d:dd,u:it.u,q,p,sub:s,edited:!!ov});sub+=s;}});
  if(items.length)groups.push({g:G.g,n:G.n,items,sub});budget+=sub;});
 const desenv=V(d.desenvPct)/100*(V(d.terrTotal)+budget);
 const custoObra=budget+desenv;
 const geren=V(d.gerenPct)/100*budget;
 const proj=V(d.projPct)/100*budget;
 const capex=custoObra+geren+proj+V(d.terrTotal);
 const M=Math.max(1,Math.round(V(d.nParcelas)||12));
 const start=addMonths(HOJE,1);
 // cronograma: distribui cada macro na sua janela
 const months=Array.from({length:M},(_,i)=>({i,label:fmtMY(addMonths(start,i)),obra:0,geren:0,proj:0,des:0,terr:0,val:0}));
 groups.forEach(G=>{let a,b;const ce=d.cronEdit&&d.cronEdit[G.g];
  if(ce){a=Math.max(0,Math.min(M-1,Math.round(ce[0])-1));b=Math.max(a+1,Math.min(M,Math.round(ce[1])));}
  else{const w=WIN[G.g]||[0,1];a=Math.floor(w[0]*M);b=Math.max(a+1,Math.ceil(w[1]*M));}
  G.a=a;G.b=b;const per=G.sub/(b-a);for(let i=a;i<b&&i<M;i++)months[i].obra+=per;});
 const obraTot=months.reduce((s,m)=>s+m.obra,0)||1;
 months.forEach((m,i)=>{m.geren=geren*m.obra/obraTot;m.des=(i<Math.min(4,M))?desenv/Math.min(4,M):0;m.proj=(i===0)?proj:0;});
 // terreno: prévio (antes), início, parcelas, final
 const tt=V(d.terrTotal),prev=V(d.terrPrevVal),ini=V(d.terrIniVal),fim=V(d.terrFimVal);
 const nP=Math.max(0,Math.round(V(d.terrParcN)));
 const rest=Math.max(0,tt-prev-ini-fim);
 if(months.length){months[0].terr+=ini;months[M-1].terr+=fim;
  if(nP>0){const per=rest/nP;for(let i=0;i<Math.min(nP,M);i++)months[i].terr+=per;}else{months[0].terr+=rest;}}
 months.forEach(m=>m.val=m.obra+m.geren+m.proj+m.des+m.terr);
 let ac=0;const cum=months.map(m=>{ac+=m.obra+m.geren+m.proj+m.des;return ac;});
 const tot=ac||1;const pct=cum.map(c=>c/tot*100);
 let pico=0,mp=0;months.forEach((m,i)=>{const v=m.obra+m.geren+m.proj+m.des;if(v>pico){pico=v;mp=i;}});
 const lic=licSched(d);const obraStart=addDays(HOJE,lic.total+30);
 return {classe:'build',ready,target,groups,budget,desenv,custoObra,geren,proj,capex,
  custoM2:custoObra/Math.max(1,V(d.abl)),months,cum,pct,pico,mp,M,start,lic,obraStart,
  terrRest:rest,terrPrev:prev};
}

/* ================= MOTOR LOTEAMENTO ================= */
function computeLot(d){
 const ready=V(d.areaUtil)>0&&V(d.valorVendaM2)>0;
 const terreno=V(d.areaTerreno)*V(d.valorTerrenoM2);
 const custoObra=V(d.areaUtil)*V(d.custoObraM2);
 const vgv=V(d.areaUtil)*V(d.valorVendaM2);
 const comissao=V(d.comissaoPct)/100*vgv,marketing=V(d.marketingPct)/100*vgv,imposto=V(d.impostoPct)/100*vgv,desenv=V(d.desenvPct)/100*vgv,adm=V(d.admPct)/100*vgv;
 const custosVGV=comissao+marketing+imposto+desenv+adm;
 const custoTotal=terreno+custoObra+custosVGV;
 const resultado=vgv-custoTotal;const margem=vgv>0?resultado/vgv*100:0;
 const pctV=(V(d.comissaoPct)+V(d.marketingPct)+V(d.impostoPct)+V(d.desenvPct)+V(d.admPct))/100;
 const mm=V(d.margemMin)/100;const den=1-pctV-mm;
 const vgvAlvo=den>0?(terreno+custoObra)/den:0;
 const precoSugM2=V(d.areaUtil)>0?vgvAlvo/d.areaUtil:0;
 const lm2=V(d.lotesMes);
 const nV=lm2>0?Math.max(1,Math.ceil(V(d.qtdLotes)/lm2)):Math.max(1,Math.round(V(d.velocidadeVenda)||V(d.prazoObra)||12));
 const ent=V(d.entradaMin)/100,mE=Math.max(1,Math.round(V(d.mesesEntrada)||1));
 const corrM=(V(d.indiceCorr)+V(d.jurosAnual))/100/12;
 const valorLote=V(d.tamLote)*V(d.valorVendaM2);
 const lpm=V(d.qtdLotes)/nV;
 const Mo=Math.max(1,Math.round(V(d.prazoObra)||12));
 const scenDefs=[['120 meses',Math.max(mE+1,Math.round(V(d.parcA)||120)),'#00C853'],
  ['180 meses',Math.max(mE+1,Math.round(V(d.parcB)||180)),'#2979FF'],
  ['240 meses',Math.max(mE+1,Math.round(V(d.parcC)||240)),'#FF6D00']];
 const parcMax=Math.max(...scenDefs.map(x=>x[1]));
 const T=nV+parcMax+2;
 const start=addMonths(HOJE,1);
 // APORTE = somente custos de obra (curva S). Terreno = investimento inicial (mês 0).
 const obraArr=new Array(T).fill(0);
 const wq=[];let sw=0;for(let i=0;i<Mo;i++){const x=(i+.5)/Mo,v=Math.exp(-Math.pow((x-.5)/.3,2));wq.push(v);sw+=v;}
 for(let i=0;i<Mo&&i<T;i++)obraArr[i]+=custoObra*wq[i]/sw;
 const terrArr=new Array(T).fill(0);if(T>0)terrArr[0]+=terreno;
 const dedNominal=comissao+marketing+imposto+desenv; // só existem com faturamento de venda
 const admPctF=V(d.admPct)/100;                       // ADM sobre o fluxo mensal da carteira
 function buildFlow(parcTotal){
  const parcSaldo=Math.max(1,parcTotal-mE);
  const rec=new Array(T).fill(0);
  for(let sv=0;sv<nV;sv++){
   const eMes=valorLote*ent*lpm/mE;
   for(let k=0;k<mE;k++){const m=sv+k;if(m<T)rec[m]+=eMes;}
   const saldo=valorLote*(1-ent)*lpm,parc=saldo/parcSaldo;
   for(let k=0;k<parcSaldo;k++){const m=sv+mE+k;if(m<T)rec[m]+=parc*Math.pow(1+corrM,k+1);}
  }
  const recTotal=rec.reduce((x,y)=>x+y,0);
  const months=[];let saldoAc=0,admTot=0,dedTot=0;
  for(let i=0;i<T;i++){
   const deduc=recTotal>0?dedNominal*rec[i]/recTotal:0;   // custos de venda proporcionais à receita
   const admM=admPctF*rec[i];                             // ADM sobre a receita mensal
   const net=rec[i]-obraArr[i]-terrArr[i]-deduc-admM;
   saldoAc+=net;admTot+=admM;dedTot+=deduc;
   months.push({i,label:fmtMY(addMonths(start,i)),rec:rec[i],obra:obraArr[i],terr:terrArr[i],deduc,adm:admM,net,saldo:saldoAc});
  }
  const anos={};months.forEach((m,i)=>{const y=addMonths(start,i).getFullYear();if(!anos[y])anos[y]={rec:0,obra:0,terr:0,deduc:0,adm:0,net:0};const a2=anos[y];a2.rec+=m.rec;a2.obra+=m.obra;a2.terr+=m.terr;a2.deduc+=m.deduc;a2.adm+=m.adm;a2.net+=m.net;});
  let expMax=0;months.forEach(m=>{if(m.saldo<expMax)expMax=m.saldo;});
  return {rec,months,anos,recTotal,expMax,parcTotal,parcSaldo,admTot,dedTot};
 }
 const flows=scenDefs.map(function(sd){return Object.assign({nome:sd[0],cor:sd[2]},buildFlow(sd[1]));});
 const primary=flows[1];
 const admInicial=adm;                 // valor inicial: % sobre o VGV inicial
 const admFlowTotal=primary.admTot;    // total recebido de ADM sobre o fluxo da carteira
 return {classe:'lot',ready,terreno,custoObra,vgv,comissao,marketing,imposto,desenv,adm,custosVGV,custoTotal,resultado,margem,precoSugM2,vgvAlvo,valorLote,
  months:primary.months,anos:primary.anos,recTotal:primary.recTotal,expMax:primary.expMax,T,flows,out:obraArr,obraArr,terrArr,start,nV,mE,parcMax,
  admInicial,admFlowTotal,admCorrTotal:admFlowTotal,dedNominal};
}
function compute(d){return d.classe==='lot'?computeLot(d):computeBuild(d);}

function renderEngHome(){
 try{document.getElementById('crumb').textContent='OneMind › OneEngineer';document.getElementById('ptitle').textContent='OneEngineer · Home';}catch(e){}
 const obras=[].concat(SIMS,DEALS).filter(d=>d&&d.nome&&d.classe!=='lot');
 const rich=obras.map(d=>({d,c:compute(d)})).filter(x=>x.c&&x.c.ready);
 if(!rich.length){document.getElementById('content').innerHTML=needData('Cadastre obras no OneBuilding para alimentar o dashboard do OneEngineer.');return;}
 const exec=rich.filter(x=>x.d.status==='con');
 const aprv=rich.filter(x=>x.d.status==='apr'||x.d.status==='con');
 const pipe=rich.filter(x=>x.d.status!=='apr'&&x.d.status!=='con');
 const baseSet=aprv.length?aprv:rich;
 const capexAprov=baseSet.reduce((a,x)=>a+x.c.capex,0);
 const hoje=new Date();const base=new Date(hoje.getFullYear(),hoje.getMonth(),1);
 const agg=Array.from({length:12},(_,k)=>({m:new Date(base.getFullYear(),base.getMonth()+k,1),v:0}));
 baseSet.forEach(x=>{const st=x.c.obraStart||x.c.start;const mensal=x.c.capex/Math.max(1,x.c.M);
  const t0=new Date(st.getFullYear(),st.getMonth(),1);
  const fim=new Date(t0.getFullYear(),t0.getMonth()+x.c.M,1);
  for(let k=0;k<12;k++){const mo=agg[k].m;if(mo>=t0&&mo<fim)agg[k].v+=mensal;}});
 const prox90=agg.slice(0,3).reduce((a,b)=>a+b.v,0);
 const W=940,H=240,pl=56,pr=12,pt=16,pb=28,iw=W-pl-pr,ih=H-pt-pb;
 const mx=Math.max(1,...agg.map(a=>a.v));const tot=agg.reduce((a,b)=>a+b.v,0)||1;
 const bw=iw/12*0.55;const TH=thc();let acum=0;
 let g='';for(let k=0;k<=3;k++){const yy=pt+ih*(1-k/3);g+=`<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${pl+iw}" y2="${yy.toFixed(1)}" stroke="${TH.gl}"/><text x="${pl-6}" y="${(yy+3).toFixed(1)}" font-size="9" fill="${TH.faint}" text-anchor="end">${kmm(mx*k/3)}</text>`;}
 const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
 const bars=agg.map((a,k)=>{const x=pl+iw*(k+0.5)/12;const h2=ih*(a.v/mx);
  return `<rect x="${(x-bw/2).toFixed(1)}" y="${(pt+ih-h2).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h2).toFixed(1)}" rx="3" fill="#0a84ff" opacity=".8"/><text x="${x.toFixed(1)}" y="${H-9}" font-size="9" fill="${TH.faint}" text-anchor="middle">${meses[a.m.getMonth()]}</text>`;}).join('');
 const pts=agg.map((a,k)=>{acum+=a.v;const x=pl+iw*(k+0.5)/12;return x.toFixed(1)+','+(pt+ih*(1-acum/tot)).toFixed(1);}).join(' ');
 const curve=`<polyline points="${pts}" fill="none" stroke="#E84C68" stroke-width="2.6" stroke-linejoin="round"/>`;
 const chip=s=>({sim:'<span class="stchip">Rascunho</span>',dev:'<span class="stchip dev">Desenvolvimento</span>',apr:'<span class="stchip apr">Aprovada</span>',con:'<span class="stchip con">Em execução</span>'}[s]||'<span class="stchip">Rascunho</span>');
 const avan=x=>{const st=x.c.obraStart||x.c.start;const el=(hoje.getFullYear()-st.getFullYear())*12+(hoje.getMonth()-st.getMonth());return Math.max(0,Math.min(100,Math.round(el/Math.max(1,x.c.M)*100)));};
 const rows=rich.map(x=>`<tr onclick="openSim('${x.d.id}')" style="cursor:pointer"><td><b>${x.d.nome}</b><div style="font-size:10.5px;color:var(--faint)">${x.d.cidade||'—'}${x.d.uf?'/'+x.d.uf:''} · ${x.d.tipo}</div></td>
  <td class="n">${brl(x.c.capex)}</td><td class="n">${x.c.M} meses</td><td class="n">${fmtMY(x.c.obraStart||x.c.start)}</td>
  <td><div class="pbar"><i style="width:${avan(x)}%"></i></div><span style="font-size:10px;color:var(--faint)">${avan(x)}%</span></td>
  <td>${chip(x.d.status)}</td></tr>`).join('');
 const maior=rich.reduce((a,b)=>b.c.capex>a.c.capex?b:a,rich[0]);
 const picoIdx=agg.reduce((bi,a,i,arr)=>a.v>arr[bi].v?i:bi,0);
 const ia=[`Portfólio de engenharia: <b>${rich.length} obras</b> — ${exec.length} em execução, ${aprv.length-exec.length} aprovadas aguardando início, ${pipe.length} em estudo.`,
  `CAPEX consolidado (obras consideradas): <b>${brl(capexAprov)}</b>; desembolso previsto nos próximos 90 dias: <b>${brl(prox90)}</b>.`,
  `Maior obra: <b>${maior.d.nome}</b> (${brl(maior.c.capex)} — ${pctf(maior.c.capex/Math.max(1,capexAprov)*100)} do CAPEX consolidado).`,
  picoIdx<=2?`Pico de desembolso do portfólio em <b>${meses[agg[picoIdx].m.getMonth()]}</b> — dentro dos próximos 90 dias; provisionar caixa agora.`:`Pico de desembolso em <b>${meses[agg[picoIdx].m.getMonth()]}/${agg[picoIdx].m.getFullYear()}</b> — planejar funding com antecedência.`];
 document.getElementById('content').innerHTML=`
  <div class="grid g4" style="margin-bottom:14px">
   <div class="stat"><div class="v">${exec.length}</div><div class="l">Obras em execução</div></div>
   <div class="stat"><div class="v">${aprv.length}</div><div class="l">Obras aprovadas</div></div>
   <div class="stat"><div class="v">${mi(capexAprov)}</div><div class="l">CAPEX consolidado</div></div>
   <div class="stat"><div class="v">${mi(prox90)}</div><div class="l">Desembolso · 90 dias</div></div></div>
  <div class="card" style="margin-bottom:14px;padding:16px 18px">
   <div class="sechead" style="font-size:13px;margin-bottom:6px">Cronograma físico-financeiro consolidado — desembolso dos próximos 12 meses</div>
   <div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}${bars}${curve}</svg></div>
   <div class="note">Barras: desembolso mensal agregado das obras (distribuição linear pelo prazo de cada obra — estimativa de protótipo). Linha coral: acumulado. Amplie (⤢) para reunião.</div></div>
  <div class="card" style="padding:0;overflow:hidden;margin-bottom:14px">
   <div style="padding:12px 16px;font-weight:600;font-size:12.5px">Obras da engenharia <span style="color:var(--faint);font-weight:400">· clique para abrir no OneBuilding</span></div>
   <div class="tblwrap"><table class="t"><thead><tr><th>Obra</th><th class="n">CAPEX</th><th class="n">Prazo</th><th class="n">Início</th><th>Avanço estimado</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="insights"><h6>Diagnóstico do Super Agente — Engenharia</h6><ul>${ia.map(x=>`<li>${x}</li>`).join('')}</ul>
   <div class="note" style="margin-top:6px">Avanço estimado por prazo decorrido (protótipo); medição física real entra na fase de dados vivos.</div></div>`;
}

function goSim(){screen='sim';cur=null;render();}
function goBoard(){screen='board';cur=null;render();}
function goConsol(){screen='consol';cur=null;render();}
function openTab(k){rtab=k;screen='sim';render();}
function render(){renderNav();try{flgSyncTab();}catch(e){}

 if(screen==='board'){renderBoard();return;}
 if(cur){renderSim();return;}
 renderSimList();}

  :'<div class="empty">Nenhum rascunho salvo. Escolha um módulo acima para começar.</div>';
 const hero=`<div class="hero">

   <div class="ot">${T('obra_t')}</div>

  <div class="opt">
   <div class="ot">${T('lot_t')}</div>

   <button class="btn dark" onclick="novo('lot')">${T('btn_lot')}</button></div></div>`;

 // ---- Springboard mobile (iOS-like) ----
 const draftsMobile = SIMS.length ? SIMS.map(s=>{
   const isL = s.classe==='lot';
   return `<button class="sb-draft ${isL?'is-lot':''}" onclick="openSim('${s.id}')">
     <span class="d-em">${isL?'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 12h17M12 3.5V12M8 12v8.5M16 12v8.5"/></svg>':'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V8l6-4v16M10 20V4l10 6v10M4 20h18"/></svg>'}</span>
     <span class="d-b"><h4>${(s.nome||'Sem nome')}</h4><p>${(s.cidade||'—')}${s.uf?' · '+s.uf:''} · ${s.savedAt?('Salvo '+s.savedAt):'Rascunho'}</p></span>
     <span class="d-x" onclick="delSim(event,'${s.id}')">Excluir</span>
   </button>`; }).join('') : '';
 const springboard = `<div class="springboard">
   <button class="sb-app sb-obra" onclick="novo('build')"><span class="sb-ic"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V8l6-4v16M10 20V4l10 6v10M4 20h18M7 11h.01M7 14h.01M14 12h.01M17 13h.01M14 16h.01M17 16h.01"/></svg></span><span class="sb-tx">${T('obra_t')}</span></button>
   <button class="sb-app sb-lot" onclick="novo('lot')"><span class="sb-ic"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 12h17M12 3.5V12M8 12v8.5M16 12v8.5"/></svg></span><span class="sb-tx">${T('lot_t')}</span></button>
   <button class="sb-app sb-board" onclick="goBoard()"><span class="sb-ic"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="13" rx="1.6"/><rect x="9.5" y="4" width="5" height="9" rx="1.6"/><rect x="16" y="4" width="5" height="16" rx="1.6"/></svg></span><span class="sb-tx">${T('board')}</span></button>
   <button class="sb-app sb-consol" onclick="goConsol()"><span class="sb-ic"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h17M6.5 16v-5M11 16V7M15.5 16v-3M20 16V4"/></svg></span><span class="sb-tx">${T('consolidado')}</span></button>
   ${SIMS.length?`<div class="sb-sec">${T('rascunhos')}</div>${draftsMobile}`:''}
 </div>`;
 document.getElementById('content').innerHTML=springboard+hero+(SIMS.length?`<div class="sechead" style="margin:6px 0 12px">${T('rascunhos')}</div><div class="grid g3">${cards}</div>`:'');
}
function novo(kind){const s=kind==='lot'?novoLot():novoBuild();s.savedAt=nowBR();SIMS.push(s);cur=s;rtab='resumo';store();render();}
function openSim(id){cur=SIMS.find(s=>s.id===id)||DEALS.find(s=>s.id===id);if(!cur)return;screen='sim';rtab='resumo';window.scrollTo(0,0);const ct=document.getElementById('content');if(ct)ct.scrollTop=0;render();}

function ganttGrid(cols,rows,footer){
 return `<div class="gwrap"><div class="gantt" style="grid-template-columns:210px repeat(${cols.length},minmax(40px,1fr)) 92px">
  <div class="gh" style="text-align:left;padding-left:12px">Etapa</div>${cols.map(c2=>`<div class="gh">${c2}</div>`).join('')}<div class="gh">Total</div>
  ${rows}${footer||''}</div></div>`;
}
function rCron(d,c){
 if(!c.ready)return needData('Informe ABL, custo e prazo para gerar o cronograma.');
 const M=c.M;
 const cols=c.months.map(m=>m.label);
 let rows='';
 c.groups.forEach(G=>{const a=G.a,b=G.b;
  rows+=`<div class="gname"><span style="overflow:hidden;text-overflow:ellipsis">${G.g} · ${G.n}</span><span class="win" data-tip="Mês de início e fim — edite para mover a etapa"><input class="cell mini" data-cg="${G.g}" data-wf="a" value="${a+1}">–<input class="cell mini" data-cg="${G.g}" data-wf="b" value="${b}"></span></div>`;
  for(let i=0;i<M;i++)rows+=`<div class="gc">${i>=a&&i<b?'<div class="gbar"></div>':''}</div>`;
  rows+=`<div class="gval">${mi(G.sub)}</div>`;});
 // linhas indiretos + terreno
 const extra=[['Gerenciamento (diluído)',c.months.map(m=>m.geren),c.geren],
  ['Projetos e licenciamento (1º mês)',c.months.map(m=>m.proj),c.proj],
  ['Desenvolvimento embutido (4 meses)',c.months.map(m=>m.des),c.desenv]];
 if(V(d.terrTotal)>0)extra.push(['Terreno (fluxo de pagamento)',c.months.map(m=>m.terr),c.months.reduce((s,m)=>s+m.terr,0)]);
 extra.forEach(([n,arr,tot])=>{rows+=`<div class="gname" style="color:var(--muted)">${n}</div>`;
  arr.forEach(v=>{rows+=`<div class="gc">${v>0.5?'<div class="gbar mark" style="opacity:.85"></div>':''}</div>`;});
  rows+=`<div class="gval">${mi(tot)}</div>`;});
 // rodapé: total mensal + % acumulado
 let foot=`<div class="gname grow-t">Desembolso mensal · R$ mi</div>`;
 c.months.forEach(m=>{foot+=`<div class="gval grow-t">${num(m.val/1e6,1)}</div>`;});
 foot+=`<div class="gval grow-t">${mi(c.months.reduce((s,m)=>s+m.val,0))}</div>`;
 foot+=`<div class="gname">% acumulado (obra)</div>`;
 c.pct.forEach(p=>{foot+=`<div class="gval">${num(p,0)}%</div>`;});
 foot+=`<div class="gval">100%</div>`;
 // curva S
 const W=760,H=170,mx=Math.max(...c.months.map(m=>m.obra+m.geren+m.proj+m.des));
 const bw=W/M;
 const bars=c.months.map((m,i)=>{const v=m.obra+m.geren+m.proj+m.des;const h=v/mx*(H-36);
  return `<rect x="${(i*bw+3).toFixed(1)}" y="${(H-20-h).toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="#1d1d1f" opacity=".82"/>`;}).join('');
 const pts=c.pct.map((p,i)=>`${(i*bw+bw/2).toFixed(1)},${(H-20-(p/100)*(H-36)).toFixed(1)}`).join(' ');
 const labels=c.months.map((m,i)=>M<=20||i%2===0?`<text x="${(i*bw+bw/2).toFixed(1)}" y="${H-6}" font-size="8" fill="#aeaeb2" text-anchor="middle">${m.label}</text>`:'').join('');
 const nCe=d.cronEdit?Object.keys(d.cronEdit).length:0;
 return `<div class="grid g3" style="margin-bottom:14px">
  ${stat(mi(c.capex-V(d.terrTotal)),'Obra + indiretos','desembolso em '+M+' meses')}

function rIAB(d,c){
 if(!c.ready)return needData('Preencha os dados para a análise do especialista.');
 const pos=[],neg=[];
 const m2=c.custoM2;
 if(m2>=2000&&m2<=3200)pos.push(`Custo de ${brl(Math.round(m2))}/m² dentro da faixa de referência FLG para galpões logísticos (R$ 2.000–3.200/m²).`);
 else if(m2<2000)neg.push(`Custo de ${brl(Math.round(m2))}/m² abaixo da faixa usual — risco de orçamento subestimado; valide fundações e incêndio.`);
 else neg.push(`Custo de ${brl(Math.round(m2))}/m² acima da faixa usual (até R$ 3.200/m²) — revise premissas ou justifique especificação premium.`);
 const share=V(d.terrTotal)/Math.max(1,c.capex)*100;
 if(V(d.terrTotal)>0){if(share<=30)pos.push(`Terreno representa ${pctf(share)} do CAPEX — proporção saudável para ativo logístico.`);
  else neg.push(`Terreno pesa ${pctf(share)} do CAPEX — acima de 30% pressiona o retorno do ativo; avalie renegociação ou permuta.`);}
 else neg.push('Valor do terreno não informado — o CAPEX está incompleto para decisão de comitê.');
 const mm=c.M/Math.max(1,V(d.abl)/2000);
 if(c.M>=10&&c.M<=20)pos.push(`Prazo de ${c.M} meses compatível com ${num(V(d.abl))} m² em estrutura pré-moldada.`);
 else if(c.M<10)neg.push(`Prazo de ${c.M} meses é agressivo para ${num(V(d.abl))} m² — risco de aceleração com custo adicional.`);
 const media=(c.capex-V(d.terrTotal))/c.M;
 if(c.pico>media*1.8)neg.push(`Pico de desembolso (${mi(c.pico)} em ${c.months[c.mp].label}) é ${num(c.pico/media,1)}× a média mensal — provisione caixa para o miolo da obra.`);
 else pos.push('Curva de desembolso equilibrada, sem concentração excessiva em um único mês.');
 if(c.terrRest>0&&V(d.terrParcN)>0)pos.push(`Terreno parcelado em ${d.terrParcN} vezes alivia o caixa inicial (${mi(c.terrRest)} diluídos).`);
 if(V(d.patio)>0&&V(d.custoPatio)>0)pos.push(`Pátio de ${num(V(d.patio))} m² a ${brl(V(d.custoPatio))}/m² agrega ABL operacional de baixo custo.`);
 const nEd=Object.keys(d.orcEdit).length;
 if(nEd)pos.push(`Orçamento calibrado manualmente em ${nEd} ${nEd===1?'item':'itens'} — aderência à realidade local.`);
 const score=pos.length/(pos.length+neg.length||1);
 const verdict=score>=0.7?['g','Recomendado ao comitê']:score>=0.45?['y','Viável com ressalvas']:['r','Revisar antes do comitê'];
 return iaCard(d,`CAPEX de ${brl(c.capex)} para ${num(V(d.abl))} m² (${brl(Math.round(c.capex/Math.max(1,V(d.abl))))}/m² all-in), obra de ${c.M} meses iniciando ${fmtMY(c.obraStart)} após licenciamento de ${Math.round(c.lic.total)} dias.`,pos,neg,verdict);
}

function rIAL(d,c){
 if(!c.ready)return needData('Preencha os dados para a análise do especialista.');
 const pos=[],neg=[];
 if(c.margem>=V(d.margemMin))pos.push(`Margem de ${pctf(c.margem)} acima do mínimo de ${pctf(V(d.margemMin))} — viável no preço atual.`);
 else neg.push(`Margem de ${pctf(c.margem)} abaixo do mínimo — preço sugerido de ${brl(Math.round(c.precoSugM2))}/m² (${pctf((c.precoSugM2/Math.max(1,V(d.valorVendaM2))-1)*100)} sobre o atual).`);
 const infra=c.custoObra/Math.max(1,c.vgv)*100;
 if(infra<=25)pos.push(`Infraestrutura em ${pctf(infra)} do VGV — dentro da referência para loteamentos.`);
 else neg.push(`Infraestrutura pesa ${pctf(infra)} do VGV — acima de 25% corrói a margem.`);
 const terr=c.terreno/Math.max(1,c.vgv)*100;
 if(terr<=20)pos.push(`Terreno em ${pctf(terr)} do VGV — aquisição competitiva.`);
 else neg.push(`Terreno em ${pctf(terr)} do VGV — avalie permuta física/financeira para reduzir caixa.`);
 if(-c.expMax>c.vgv*0.15)neg.push(`O caixa investido chega a ${mi(-c.expMax)} (>15% do VGV) — venda mais rápido ou aumente a entrada (hoje ${pctf(V(d.entradaMin))}).`);
 else pos.push(`Caixa investido máximo de ${mi(-c.expMax)} — confortável frente ao VGV.`);
 if(V(d.parcB)>96)neg.push(`Cenário médio de ${V(d.parcB)} meses alonga o retorno — avalie securitização da carteira após performance.`);
 else pos.push(`Correção de ${pctf(V(d.indiceCorr)+V(d.jurosAnual))} a.a. sobre o saldo devedor protege o valor da carteira.`);
 const aproveit=V(d.areaUtil)/Math.max(1,V(d.areaTerreno))*100;
 if(aproveit>=50&&aproveit<=70)pos.push(`Aproveitamento de ${pctf(aproveit)} da gleba — típico para loteamento ${d.tipo.includes('fechado')?'fechado':'aberto'}.`);
 else if(aproveit>0&&aproveit<50)neg.push(`Aproveitamento de apenas ${pctf(aproveit)} da gleba — verifique áreas verdes/institucionais exigidas.`);
 const score=pos.length/(pos.length+neg.length||1);
 const verdict=score>=0.7?['g','Recomendado ao comitê']:score>=0.45?['y','Viável com ressalvas']:['r','Revisar antes do comitê'];
 const lm=V(d.lotesMes)||Math.max(1,Math.ceil(V(d.qtdLotes)/24));

(function(){var x0=null;
 function ts(e){x0=e.touches?e.touches[0].clientX:null;}
 function te(e){if(x0===null)return;var x1=(e.changedTouches?e.changedTouches[0].clientX:0);var dx=x1-x0;
   if(x0<24 && dx>50){window.flgToggleNav&&window.flgToggleNav(true);}
   if(document.body.classList.contains('mopen') && dx<-50){window.flgToggleNav&&window.flgToggleNav(false);}
   x0=null;}
 document.addEventListener('touchstart',ts,{passive:true});
 document.addEventListener('touchend',te,{passive:true});
})();

/* ===== iPhone: garantir conteudo do deal 100% visivel ===== */
function _flgMarkWide(w){try{requestAnimationFrame(function(){
  var t=w.querySelector('table'); if(!t)return;
  var wide=t.scrollWidth > w.clientWidth+4;
  var prev=w.previousElementSibling;
  var hasHint=prev&&prev.classList&&prev.classList.contains('xhint');
  if(wide && !hasHint){var h=document.createElement('div');h.className='xhint';h.textContent='deslize para ver toda a tabela';w.parentNode.insertBefore(h,w);}
  if(!wide && hasHint){prev.remove();}
});}catch(e){}}
function wrapWide(){try{
  if(window.innerWidth>760)return;
  var c=document.getElementById('content'); if(!c)return;
  var tbls=c.querySelectorAll('table.t');
  for(var i=0;i<tbls.length;i++){var t=tbls[i];var p=t.parentElement;if(!p)continue;
    if(p.classList.contains('xscroll')){_flgMarkWide(p);continue;}
    if(p.classList.contains('tblwrap')){continue;} /* ja rola */
    var w=document.createElement('div');w.className='xscroll';p.insertBefore(w,t);w.appendChild(t);_flgMarkWide(w);
  }
}catch(e){}}
if(typeof render==='function'){var __flgOrigRender=render;render=function(){var r=__flgOrigRender.apply(this,arguments);try{requestAnimationFrame(wrapWide);}catch(e){try{wrapWide();}catch(_e){}}return r;};}
window.addEventListener('resize',function(){clearTimeout(window.__flgWW);window.__flgWW=setTimeout(wrapWide,180);});

window.flgYearDetail=function(ev,y){try{
 var host=ev.target.closest('.chart');if(!host)return;var box=host.querySelector('.ydet');if(!box)return;
 if(box.dataset.y===String(y)&&box.style.display!=='none'){box.style.display='none';box.dataset.y='';return;}
 var d=cur;if(!d)return;var c=compute(d);if(!c.flows)return;
 var idx=[];c.months.forEach(function(m,i){if(addMonths(c.start,i).getFullYear()===y)idx.push(i);});
 var ms=idx.map(function(i){return c.months[i];});
 var recS=c.flows.map(function(f){return idx.reduce(function(a,i){return a+(f.rec[i]||0);},0);});
 var out=ms.reduce(function(a,m){return a+m.obra+m.terr+m.deduc+m.adm;},0);
 var rows=ms.map(function(m){return '<tr><td>'+m.label+'</td><td class="n">'+brl(m.rec)+'</td><td class="n">'+brl(m.obra+m.terr+m.deduc+m.adm)+'</td><td class="n" style="color:'+(m.saldo>=0?'#34c759':'#E84C68')+'">'+brl(m.saldo)+'</td></tr>';}).join('');
 box.innerHTML='<div style="border-top:1px solid var(--line2);margin-top:10px;padding-top:10px">'
  +'<div style="font-weight:700;font-size:13px;margin-bottom:6px">Carteira detalhada · '+y+'</div>'
  +'<div style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:8px">'
  +c.flows.map(function(f,i){return '<div><div style="font-size:16px;font-weight:700;color:'+f.cor+'">'+brl(recS[i])+'</div><div style="font-size:10.5px;color:var(--muted)">Receita '+f.nome+'</div></div>';}).join('')
  +'<div><div style="font-size:16px;font-weight:700;color:#8a929c">'+brl(out)+'</div><div style="font-size:10.5px;color:var(--muted)">Aportes no ano</div></div>'
  +'<div><div style="font-size:16px;font-weight:700;color:'+(ms.length&&ms[ms.length-1].saldo>=0?'#34c759':'#E84C68')+'">'+brl(ms.length?ms[ms.length-1].saldo:0)+'</div><div style="font-size:10.5px;color:var(--muted)">Exposição ao fim do ano</div></div></div>'
  +'<div class="tblwrap" style="max-height:260px"><table class="t"><thead><tr><th>Mês</th><th class="n">Receita (médio)</th><th class="n">Aportes</th><th class="n">Caixa acum.</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
 box.dataset.y=String(y);box.style.display='block';
}catch(e){}};
/* ===== v22: planilhas — clique marca linha (célula) ou coluna (cabeçalho) ===== */
document.addEventListener('click',function(e){try{
 if(e.target.closest('input,button,a,select,textarea'))return;
 var cell=e.target.closest('table.t td, table.t th');if(!cell)return;
 var table=cell.closest('table.t');if(!table)return;
 if(cell.tagName==='TH'){
  var idx=Array.prototype.indexOf.call(cell.parentNode.children,cell);
  var on=!cell.classList.contains('hlcol');
  table.querySelectorAll('.hlcol').forEach(function(x){x.classList.remove('hlcol');});
  if(on)table.querySelectorAll('tr').forEach(function(tr){var c2=tr.children[idx];if(c2)c2.classList.add('hlcol');});
 }else{
  var tr=cell.closest('tr');if(!tr||tr.hasAttribute('onclick'))return;
  var on2=!tr.classList.contains('hlrow');
  table.querySelectorAll('tr.hlrow').forEach(function(x){x.classList.remove('hlrow');});
  if(on2)tr.classList.add('hlrow');}
}catch(_e){}},true);
